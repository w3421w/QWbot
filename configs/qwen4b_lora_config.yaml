model:
  model_name_or_path: Qwen/Qwen3-4B
  trust_remote_code: true
  torch_dtype: bfloat16

data:
  # Keep full datasets outside the public repository.
  train_file: /secure/path/qwbot_v2_alpha_train.jsonl
  validation_file: /secure/path/qwbot_v2_alpha_val.jsonl
  messages_field: messages

lora:
  task_type: CAUSAL_LM
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: output/qwbot_v2_alpha_lora
  num_train_epochs: 3
  learning_rate: 1.5e-5
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  bf16: true
  fp16: false
  gradient_checkpointing: true
  seed: 20261013

sft:
  max_seq_length: 1024
  packing: false
